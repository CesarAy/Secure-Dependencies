name: CI with Security Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      # Keep scanner dependencies separate so they cannot upgrade the lab packages.
      - name: Install isolated security tools
        run: |
          python -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/python" -m pip install safety bandit pip-audit

      - name: Run Tests
        run: python -m pytest tests/

      # Supplement the provided Safety check with a scan that needs no Safety account.
      - name: Dependency vulnerability details - pip-audit
        run: |
          "$RUNNER_TEMP/security-tools/bin/pip-audit" -r requirements.txt --desc on --aliases on
        continue-on-error: true

      - name: Security Check 1 - Dependency Scan
        run: |
          echo "🔍 Checking for vulnerable dependencies..."
          "$RUNNER_TEMP/security-tools/bin/safety" check -r requirements.txt
        timeout-minutes: 2
        continue-on-error: true

      - name: Security Check 2 - Code Security Scan
        run: |
          echo "🔐 Scanning code for security issues..."
          "$RUNNER_TEMP/security-tools/bin/bandit" -r src/ -ll
        continue-on-error: true
